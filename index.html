<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
body{background:linear-gradient(145deg,#efeaf9 0%,#e3daf5 100%);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:12px;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom));margin:0;overscroll-behavior:none}
.app-container{max-width:420px;width:100%;background:rgba(255,255,255,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:40px;padding:20px 16px 24px;box-shadow:0 25px 45px rgba(55,30,90,.15),0 8px 18px rgba(70,40,120,.08);border:1px solid rgba(255,255,255,.8)}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding:0 4px}
.header h1{font-size:22px;font-weight:700;letter-spacing:-.5px;color:#2d1b46;display:flex;align-items:center;gap:6px}
.header h1 span{background:#5e3e9c;color:#fff;font-size:12px;font-weight:600;padding:3px 10px;border-radius:60px}
.top-actions{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
.icon-btn{background:#f0eafd;border:1px solid rgba(255,255,255,.6);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:.15s;position:relative}
.icon-btn:active{transform:scale(.92);background:#e2d6f5}
.coin-badge{background:linear-gradient(135deg,#ffd700,#ffb800);color:#5a3d00;padding:5px 10px;border-radius:60px;font-weight:800;font-size:12px;display:flex;align-items:center;gap:3px;box-shadow:0 6px 14px rgba(255,184,0,.35);white-space:nowrap}
.badge-dot{position:absolute;top:-2px;right:-2px;width:11px;height:11px;background:#ef4444;border-radius:50%;border:2px solid #fff;display:none}
.badge-dot.show{display:block}
.date-row{display:flex;align-items:center;justify-content:space-between;padding:0 4px;margin-bottom:14px}
.date-text{font-size:13px;font-weight:500;color:#5d4a7a;background:#e7dffa;padding:5px 14px;border-radius:60px;display:flex;align-items:center;gap:5px}
.reset-btn-sm{background:#f0eafd;border:1px solid rgba(255,255,255,.6);color:#7c6b94;font-weight:600;font-size:12px;padding:6px 12px;border-radius:60px;cursor:pointer;transition:.15s}
.reset-btn-sm:active{transform:scale(.95)}

/* 猫咪区域 */
.cat-card{background:linear-gradient(135deg,#fff5e6,#ffe8cc);border-radius:30px;padding:14px;margin-bottom:12px;border:2px solid #ffd9a3;box-shadow:0 8px 20px rgba(255,180,80,.15);position:relative;overflow:hidden}
.cat-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cat-avatar{font-size:48px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.08));transition:transform .3s;position:relative;cursor:pointer}
.cat-avatar.bounce{animation:bounce .5s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.cat-info{flex:1;min-width:0}
.cat-name{font-weight:800;font-size:15px;color:#6b4423;display:flex;align-items:center;gap:5px}
.cat-level{background:#ffb800;color:#fff;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:700}
.cat-bars{display:flex;flex-direction:column;gap:4px;margin-top:5px}
.cat-bar-row{display:flex;align-items:center;gap:5px;font-size:10px;color:#8a6d4b;font-weight:600}
.cat-bar-bg{flex:1;height:7px;background:#ffe4c4;border-radius:10px;overflow:hidden}
.cat-bar-fill{height:100%;border-radius:10px;transition:width .4s}
.cat-bar-fill.hunger{background:linear-gradient(90deg,#ff9a5a,#ff6b35)}
.cat-bar-fill.mood{background:linear-gradient(90deg,#7dd3fc,#3b82f6)}
.cat-bubble{background:#fff;border-radius:16px;padding:9px 12px;font-size:12px;color:#6b4423;font-weight:600;line-height:1.4;position:relative;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:opacity .3s;min-height:38px;display:flex;align-items:center}
.cat-bubble::before{content:'';position:absolute;top:-6px;left:26px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:6px solid #fff}
.cat-actions{display:flex;gap:6px}
.cat-btn{flex:1;border:none;border-radius:18px;padding:9px 4px;font-weight:700;font-size:12px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:3px}
.cat-btn:active{transform:scale(.95)}
